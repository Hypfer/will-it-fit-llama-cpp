<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will It Fit? - Opinionated llama.cpp VRAM Estimator</title>
<style>
  /* --- BASE & VARIABLES --- */
  :root {
    --bg-main: #ffffff;
    --bg-sidebar: #f8fafc;
    --text-main: #0f172a;
    --text-muted: #475569;
    --text-light: #64748b;
    --border-color: #e2e8f0;

    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-bg: #e0e7ff;
    --accent-text: #3730a3;

    --success-bg: #dcfce7;
    --success-text: #166534;
    --warn-bg: #fef08a;
    --warn-text: #854d0e;
    --error-bg: #fee2e2;
    --error-text: #991b1b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'SF Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    background: var(--bg-main);
    color: var(--text-main);
    display: flex;
  }

  /* --- LAYOUT --- */
  #sidebar {
    width: 340px;
    min-width: 340px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    padding: 1.5rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  #main { flex: 1; padding: 2rem; overflow-y: auto; min-width: 0; }

  /* --- TYPOGRAPHY --- */
  h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; color: var(--text-main); }
  .subtitle { font-weight: 400; font-size: 0.8em; color: var(--text-muted); }
  .intro-text { font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.5rem; }

  label {
    display: block;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-top: 0.5rem;
    margin-bottom: 0.25rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* --- INPUTS & CONTROLS --- */
  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 0.5rem 0.6rem;
    background: var(--bg-main);
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.85rem;
    transition: all 0.2s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  input[type="range"] {
    width: 100%; margin: 0 0 0.35rem; accent-color: var(--accent); height: 2rem; cursor: pointer;
  }
  .ctx-row { display: flex; align-items: center; gap: 0.75rem; }
  .ctx-val { min-width: 3.5rem; text-align: right; font-size: 0.85rem; color: var(--text-main); font-weight: 600; }

  /* --- BUTTONS --- */
  .btn {
    padding: 0.6rem 1rem;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-weight: 600;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    width: 100%;
    margin-top: 0.5rem;
    transition: background 0.2s;
    box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

  /* Presets */
  .preset-group { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.25rem; }
  .preset-btn {
    padding: 0.3rem 0.6rem;
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preset-btn:hover { border-color: #94a3b8; color: var(--text-main); }
  .preset-btn.active {
    border-color: var(--accent);
    color: var(--accent-text);
    background: var(--accent-bg);
    font-weight: 600;
  }
  .preset-label { font-size: 0.65rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; width: 100%; margin-top: 0.4rem; }

  /* --- MISC UI --- */
  .sidebar-sep { border: none; border-bottom: 1px solid var(--border-color); margin: 0.75rem 0; }
  .footer-text { margin-top: auto; padding-top: 1.5rem; font-size: 0.7rem; color: var(--text-light); line-height: 1.5; }
  .footer-text a { color: var(--text-muted); text-decoration: underline; text-underline-offset: 2px; }
  .footer-text a:hover { color: var(--text-main); }

  /* --- MAIN CONTENT & RESULTS --- */
  #meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2rem; line-height: 1.6; background: var(--bg-sidebar); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); }
  #meta strong { color: var(--text-main); font-size: 1rem; }
  #error { background: var(--error-bg); color: var(--error-text); padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; display: none; font-weight: 500; border: 1px solid #f87171; }

  .result-header { font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 1rem; }
  .result-header a { color: var(--accent); text-decoration: none; font-weight: 400; }
  .result-header a:hover { text-decoration: underline; }

  .table-container { overflow-x: auto; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th { font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; padding: 0.6rem 0.5rem; border-bottom: 2px solid var(--border-color); white-space: nowrap; }
  td { padding: 0.6rem 0.5rem; font-size: 0.85rem; border-bottom: 1px solid var(--border-color); color: var(--text-main); white-space: nowrap; }
  td:last-child, th:last-child { text-align: right; }

  .table-link { color: var(--text-main); text-decoration: none; font-weight: 600; transition: color 0.15s; }
  .table-link:hover { color: var(--accent); text-decoration: underline; }

  .row-sep td { border-top: 1px dashed #94a3b8; padding: 0.5rem 0.5rem; }
  .sep-label { color: var(--text-light); font-style: italic; font-size: 0.75rem; text-align: center; }

  /* --- BADGES & STATUS --- */
  .badge { display: inline-block; min-width: 3.2rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 0.5rem; text-align: center; }
  .badge-yes { background: var(--success-bg); color: var(--success-text); }
  .badge-no { background: var(--error-bg); color: var(--error-text); }
  .badge-warn { background: var(--warn-bg); color: var(--warn-text); }

  .fit-yes { color: var(--success-text); font-weight: 600; }
  .fit-no { color: var(--error-text); font-weight: 600; }
  .fit-warn { color: var(--warn-text); font-weight: 600; }
  .headroom { color: var(--text-light); font-size: 0.75rem; font-weight: 400; }

  /* --- COMMAND BOX --- */
  .cmd-label { font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2rem; margin-bottom: 0.5rem; font-weight: 600; transition: color 0.2s; }
  .cmd-box { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 6px; font-family: inherit; font-size: 0.8rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; border: 1px solid #334155; cursor: pointer; position: relative; }
  .cmd-box:hover { border-color: #475569; }
  .cmd-box code { user-select: all; pointer-events: none; }

  /* --- DFLASH INFO --- */
  #dflash-info { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; margin-top: 0.25rem; }
  #mtp-sidecar-info { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; margin-top: 0.25rem; }
  .sidecar-link { color: var(--text-main); text-decoration: none; font-weight: 600; transition: color 0.15s; }
  .sidecar-link:hover { color: var(--accent); text-decoration: underline; }

  /* --- MOBILE FIX --- */
  @media (max-width: 768px) {
    html, body { height: auto; display: block; }
    body { flex-direction: column; }
    #sidebar {
      width: 100%;
      min-width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border-color);
      overflow-y: visible;
      padding: 1.25rem;
    }
    #main { padding: 1.25rem; overflow-y: visible; }
    .footer-text { margin-top: 1.5rem; }
  }
</style>
</head>
<body>
<div id="sidebar">
  <h1>Will It Fit? <span class="subtitle">That is the question</span></h1>
  <p class="intro-text">llama.cpp VRAM estimator for normal people. Assumes single GPU, all layers offloaded. Pessimistic. Actual usage may be lower.<br>Vibecoded. Check your own sanity.</p>

  <label>Model</label>
  <div class="preset-group" id="model-presets"></div>

  <label>GGUF repo</label>
  <input type="text" id="repo" value="unsloth/Qwen3.8-27B-GGUF" />

  <button class="btn" id="load">Load Model Metadata</button>

  <hr class="sidebar-sep" />

  <label>GPU</label>
  <div class="preset-group" id="gpu-presets"></div>

  <label>VRAM (GB)</label>
  <input type="number" id="vram" value="24" step="0.1" min="1" />

  <label>System reserve (MB)</label>
  <input type="number" id="reserve" value="1024" step="64" min="0" />

  <hr class="sidebar-sep" />

  <label>Context (n_ctx)</label>
  <div class="ctx-row">
    <input type="range" id="ctx-slider" min="256" max="131072" step="256" value="2048" />
    <span class="ctx-val" id="ctx-display">2048</span>
  </div>

  <label>Ubatch (-ub)</label>
  <div class="ctx-row">
    <input type="range" id="ubatch-slider" min="256" max="4096" step="256" value="512" />
    <span class="ctx-val" id="ubatch-display">512</span>
  </div>

  <hr class="sidebar-sep" />

  <label>K cache quant</label>
  <select id="k-quant">
    <option value="2">fp16 (2.0 BPP)</option>
    <option value="1.0625" selected>q8_0 (1.06 BPP)</option>
    <option value="0.75">q5_1 (0.75 BPP)</option>
    <option value="0.6875">q5_0 (0.69 BPP)</option>
    <option value="0.625">q4_1 (0.63 BPP)</option>
    <option value="0.5625">q4_0 (0.56 BPP)</option>
    <option value="0.5625">iq4_nl (0.56 BPP)</option>
  </select>

  <label>V cache quant</label>
  <select id="v-quant">
    <option value="2">fp16 (2.0 BPP)</option>
    <option value="1.0625" selected>q8_0 (1.06 BPP)</option>
    <option value="0.75">q5_1 (0.75 BPP)</option>
    <option value="0.6875">q5_0 (0.69 BPP)</option>
    <option value="0.625">q4_1 (0.63 BPP)</option>
    <option value="0.5625">q4_0 (0.56 BPP)</option>
    <option value="0.5625">iq4_nl (0.56 BPP)</option>
  </select>

  <div id="mtp-section" style="display:none;">
    <hr class="sidebar-sep" />
    <label>MTP drafting</label>
    <div id="mtp-info" style="font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; margin-top: 0.25rem;"></div>
    <label class="checkbox-label" style="flex-direction: row; align-items: center; gap: 0.5rem; text-transform: none; letter-spacing: 0; margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-main); cursor: pointer;">
      <input type="checkbox" id="mtp-toggle" style="width: auto; margin: 0;" checked />
      Enable MTP drafting
    </label>

    <label>MTP K cache quant</label>
    <select id="mtp-k-quant">
      <option value="2">fp16 (2.0 BPP)</option>
      <option value="1.0625">q8_0 (1.06 BPP)</option>
      <option value="0.75">q5_1 (0.75 BPP)</option>
      <option value="0.6875">q5_0 (0.69 BPP)</option>
      <option value="0.625">q4_1 (0.63 BPP)</option>
      <option value="0.5625" selected>q4_0 (0.56 BPP)</option>
      <option value="0.5625">iq4_nl (0.56 BPP)</option>
    </select>

    <label>MTP V cache quant</label>
    <select id="mtp-v-quant">
      <option value="2">fp16 (2.0 BPP)</option>
      <option value="1.0625">q8_0 (1.06 BPP)</option>
      <option value="0.75">q5_1 (0.75 BPP)</option>
      <option value="0.6875">q5_0 (0.69 BPP)</option>
      <option value="0.625">q4_1 (0.63 BPP)</option>
      <option value="0.5625" selected>q4_0 (0.56 BPP)</option>
      <option value="0.5625">iq4_nl (0.56 BPP)</option>
    </select>
  </div>

  <div id="dflash-section" style="display:none;">
    <hr class="sidebar-sep" />
    <label>DFlash draft model</label>
    <div id="dflash-info"></div>
    <label class="checkbox-label" style="flex-direction: row; align-items: center; gap: 0.5rem; text-transform: none; letter-spacing: 0; margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-main); cursor: pointer;">
      <input type="checkbox" id="dflash-toggle" style="width: auto; margin: 0;" checked />
      Enable DFlash drafting
    </label>
    <label>DFlash K cache quant</label>
    <select id="dflash-k-quant">
      <option value="2">fp16 (2.0 BPP)</option>
      <option value="1.0625" selected>q8_0 (1.06 BPP)</option>
      <option value="0.75">q5_1 (0.75 BPP)</option>
      <option value="0.6875">q5_0 (0.69 BPP)</option>
      <option value="0.625">q4_1 (0.63 BPP)</option>
      <option value="0.5625">q4_0 (0.56 BPP)</option>
      <option value="0.5625">iq4_nl (0.56 BPP)</option>
    </select>

    <label>DFlash V cache quant</label>
    <select id="dflash-v-quant">
      <option value="2">fp16 (2.0 BPP)</option>
      <option value="1.0625" selected>q8_0 (1.06 BPP)</option>
      <option value="0.75">q5_1 (0.75 BPP)</option>
      <option value="0.6875">q5_0 (0.69 BPP)</option>
      <option value="0.625">q4_1 (0.63 BPP)</option>
      <option value="0.5625">q4_0 (0.56 BPP)</option>
      <option value="0.5625">iq4_nl (0.56 BPP)</option>
    </select>
  </div>

  <div id="mtp-sidecar-section" style="display:none;">
    <hr class="sidebar-sep" />
    <label>Gemma4 MTP draft model</label>
    <div id="mtp-sidecar-info"></div>
    <label class="checkbox-label" style="flex-direction: row; align-items: center; gap: 0.5rem; text-transform: none; letter-spacing: 0; margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-main); cursor: pointer;">
      <input type="checkbox" id="mtp-sidecar-toggle" style="width: auto; margin: 0;" checked />
      Enable MTP drafting
    </label>
  </div>

  <div id="mmproj-section" style="display:none;">
    <hr class="sidebar-sep" />
    <label>Vision projector (mmproj)</label>
    <div id="mmproj-info"></div>
    <label>Mmproj offload</label>
    <select id="mmproj-mode">
      <option value="off" selected>Off (text only)</option>
      <option value="cpu">CPU (--no-mmproj-offload)</option>
      <option value="gpu">GPU (full weight cost)</option>
    </select>
  </div>

  <div class="footer-text">
    Grounded with <a href="https://github.com/ggml-org/llama.cpp/commit/d2f8305" target="_blank">llama.cpp d2f8305</a><br>2026-08-10
  </div>
</div>

<div id="main">
  <div id="error"></div>
  <div id="meta"></div>
  <div id="results"></div>
  <div id="cmd-container"></div>
</div>

<script type="module">
  import { init } from './js/app.js';
  init();
</script>
</body>
</html>
